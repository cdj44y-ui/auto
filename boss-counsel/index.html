<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>사장님 고민 상담소</title>
<meta name="description" content="사장님이 자주 겪는 노무 고민을 상황별로 골라 오늘 할 일까지 정리해 드립니다.">
<style>
  :root {
    --bg: #faf7f2;
    --surface: #ffffff;
    --text: #2b2723;
    --muted: #6b635b;
    --line: #e4ddd3;
    --accent: #2f6f62;
    --accent-soft: #e6f0ed;
    --accent-text: #ffffff;
    --note: #f3ede4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a18;
      --surface: #262320;
      --text: #f1ece5;
      --muted: #b4aa9e;
      --line: #3a3530;
      --accent: #6fb3a3;
      --accent-soft: #233531;
      --accent-text: #10201c;
      --note: #2c2824;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.65;
    word-break: keep-all;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 32px; }
  header h1 { font-size: 26px; line-height: 1.35; margin: 8px 0 4px; }
  header p { margin: 0 0 20px; color: var(--muted); }
  h2 { font-size: 22px; line-height: 1.4; margin: 4px 0 16px; }
  h3 { font-size: 18px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .list { display: grid; gap: 10px; }
  button.choice {
    width: 100%;
    min-height: 64px;
    padding: 14px 16px;
    font: inherit;
    font-size: 18px;
    text-align: left;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
  }
  button.choice:active { background: var(--accent-soft); }
  button.choice:focus-visible, a:focus-visible, .back:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.choice .emoji { display: block; font-size: 24px; line-height: 1.2; margin-bottom: 4px; }
  button.choice.other { background: transparent; border-style: dashed; color: var(--muted); }
  .back {
    font: inherit; font-size: 17px; color: var(--muted);
    background: none; border: 0; padding: 8px 0; margin-bottom: 8px; cursor: pointer;
  }
  .card { display: grid; gap: 14px; }
  .block { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .heart { font-size: 19px; background: var(--note); border: 0; }
  .conclusion { font-size: 21px; font-weight: 700; line-height: 1.5; border-left: 5px solid var(--accent); }
  .todo label { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
  .todo input { width: 24px; height: 24px; margin-top: 3px; flex: none; accent-color: var(--accent); }
  .todo input:checked + span { color: var(--muted); text-decoration: line-through; }
  ul.plain { margin: 0; padding-left: 20px; }
  ul.plain li { margin: 4px 0; }
  .media a { display: block; padding: 6px 0; color: var(--accent); font-weight: 600; }
  .refs { font-size: 17px; color: var(--muted); }
  .cta {
    display: block; text-align: center; text-decoration: none;
    font-size: 19px; font-weight: 700;
    background: var(--accent); color: var(--accent-text);
    border-radius: 14px; padding: 18px 16px;
  }
  .draft-flag { font-size: 17px; background: var(--note); border-radius: 10px; padding: 10px 14px; }
  .empty { color: var(--muted); }
  footer.notice {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    font-size: 17px; line-height: 1.5; color: var(--muted); text-align: center;
  }
  @media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <p class="empty">불러오는 중…</p>
</main>
<footer class="notice">일반적인 기준을 설명한 것으로, 개별 사안은 사실관계에 따라 달라질 수 있습니다.</footer>

<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  // ?draft=1 : 검수 전 카드를 "검수 전" 표시와 함께 미리 보기(내부 확인용). 기본값에서는 절대 노출되지 않음.
  var DRAFT_MODE = new URLSearchParams(location.search).get("draft") === "1";
  var data = null;
  var warned = {};

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "onclick") node.addEventListener("click", attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  // live 판정: status === "live" 이고, legalRefs가 있으면 verifiedAt이 채워져 있어야 한다.
  function isLive(card) {
    if (card.status !== "live") return false;
    var hasRefs = Array.isArray(card.legalRefs) && card.legalRefs.length > 0;
    if (hasRefs && !card.verifiedAt) {
      if (!warned[card.id]) console.warn("[사장님 고민 상담소] legalRefs가 있으나 verifiedAt이 비어 있어 live로 렌더링하지 않습니다:", card.id);
      warned[card.id] = true;
      return false;
    }
    return true;
  }

  function visible(card) { return isLive(card) || (DRAFT_MODE && card.status !== "archived"); }

  function backButton() {
    return el("button", { class: "back", type: "button", text: "← 처음으로", onclick: function () { history.back(); } });
  }

  function renderHome() {
    var grid = el("div", { class: "grid" });
    data.situations.forEach(function (s) {
      grid.appendChild(el("button", { class: "choice", type: "button", onclick: function () { go({ v: "s", s: s.id }); } }, [
        el("span", { class: "emoji", "aria-hidden": "true", text: s.emoji || "" }),
        el("span", { text: s.label })
      ]));
    });
    app.replaceChildren(
      el("header", null, [
        el("h1", { text: "사장님 고민 상담소" }),
        el("p", { text: "지금 어떤 상황이세요? 하나만 골라 주세요." })
      ]),
      grid
    );
    window.scrollTo(0, 0);
  }

  function renderSituation(sid) {
    var s = data.situations.filter(function (x) { return x.id === sid; })[0];
    if (!s) return renderHome();
    var cards = data.cards.filter(function (c) { return c.situation === sid && visible(c); }).slice(0, 3);
    var list = el("div", { class: "list" });
    cards.forEach(function (c) {
      list.appendChild(el("button", { class: "choice", type: "button", text: c.worry, onclick: function () { go({ v: "c", c: c.id }); } }));
    });
    if (!cards.length) list.appendChild(el("p", { class: "empty", text: "이 상황의 답 카드는 준비 중이에요." }));
    list.appendChild(el("button", { class: "choice other", type: "button", text: "제 상황은 달라요", onclick: function () { go({ v: "o", s: sid }); } }));
    app.replaceChildren(backButton(), el("h2", { text: s.label }), list);
    window.scrollTo(0, 0);
  }

  function section(title, body, cls) {
    return el("section", { class: "block " + (cls || "") }, [title ? el("h3", { text: title }) : null].concat(body));
  }

  function ctaButton(cta) {
    var c = cta || data.defaultCta;
    if (!c || !c.href) return null;
    var external = /^https?:/.test(c.href);
    var attrs = { class: "cta", href: c.href, text: c.label };
    if (external) { attrs.target = "_blank"; attrs.rel = "noopener noreferrer"; }
    return el("a", attrs);
  }

  function renderCard(cid) {
    var c = data.cards.filter(function (x) { return x.id === cid; })[0];
    if (!c || !visible(c)) return renderHome();
    var parts = [backButton()];
    if (!isLive(c)) parts.push(el("p", { class: "draft-flag", text: "검수 전 초안입니다. 공개 화면에는 나오지 않습니다." }));

    parts.push(el("h2", { text: c.worry }));
    var card = el("article", { class: "card" });

    // 1) 마음 1줄
    card.appendChild(section(null, [el("p", { style: "margin:0", text: c.heart })], "heart"));
    // 2) 결론 1줄
    card.appendChild(section(null, [el("p", { style: "margin:0", text: c.conclusion })], "conclusion"));
    // 3) 오늘 할 일 3개
    var todo = el("div", { class: "todo" });
    (c.todos || []).slice(0, 3).forEach(function (t, i) {
      var id = c.id + "-t" + i;
      todo.appendChild(el("label", { for: id }, [el("input", { type: "checkbox", id: id }), el("span", { text: t })]));
    });
    card.appendChild(section("오늘 할 일", [todo]));
    // 4) 이럴 땐 노무사에게
    if (c.askExpert && c.askExpert.length) {
      var ul = el("ul", { class: "plain" });
      c.askExpert.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
      card.appendChild(section("이럴 땐 노무사에게", [ul]));
    }
    // 5) 영상·1장
    var m = c.media || {};
    var links = [];
    if (m.video) links.push(el("a", { href: m.video, target: "_blank", rel: "noopener noreferrer", text: "▶ 짧은 영상으로 보기" }));
    if (m.onePager) links.push(el("a", { href: m.onePager, target: "_blank", rel: "noopener noreferrer", text: "📄 1장으로 정리한 자료" }));
    if (links.length) card.appendChild(section("영상·1장", links, "media"));
    // 근거
    if (c.legalRefs && c.legalRefs.length) {
      card.appendChild(el("p", { class: "refs", text: "근거: " + c.legalRefs.map(function (r) { return r.law + " " + r.article; }).join(" · ") }));
    }
    // 6) CTA 1개
    var btn = ctaButton(c.cta);
    if (btn) card.appendChild(btn);

    parts.push(card);
    app.replaceChildren.apply(app, parts);
    window.scrollTo(0, 0);
  }

  function renderOther(sid) {
    var parts = [backButton(), el("h2", { text: "상황이 조금 다르시군요" })];
    var card = el("article", { class: "card" }, [
      section(null, [el("p", { style: "margin:0", text: data.other.heart })], "heart"),
      section(null, [el("p", { style: "margin:0", text: data.other.conclusion })], "conclusion")
    ]);
    var btn = ctaButton(data.other.cta);
    if (btn) card.appendChild(btn);
    parts.push(card);
    app.replaceChildren.apply(app, parts);
    window.scrollTo(0, 0);
  }

  function render(state) {
    if (!state || !state.v) return renderHome();
    if (state.v === "s") return renderSituation(state.s);
    if (state.v === "c") return renderCard(state.c);
    if (state.v === "o") return renderOther(state.s);
    renderHome();
  }

  // 히스토리는 항상 [처음, 현재] 2칸만 유지 → 뒤로 가기 1번이면 처음으로.
  function go(state) {
    if (history.state && history.state.v) history.replaceState(state, "");
    else history.pushState(state, "");
    render(state);
  }

  window.addEventListener("popstate", function (e) { render(e.state); });

  fetch("data/cards.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (json) {
      data = json;
      data.cards.forEach(isLive); // 로드 시 1회 검사(경고 출력)
      if (history.state && history.state.v) history.replaceState(null, "");
      renderHome();
    })
    .catch(function () {
      app.replaceChildren(el("p", { class: "empty", text: "내용을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요." }));
    });
})();
</script>
</body>
</html>
